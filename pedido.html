<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido confirmado – Arena Brasil Figurinhas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .pedido-wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    /* Hero */
    .pedido-hero {
      text-align: center;
      padding: 32px 24px 28px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .hero-icon {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      animation: pop .35s ease;
    }
    .hero-icon.success { background: var(--green-lt); color: var(--green); }
    .hero-icon.pending { background: #fef3c7; color: #b45309; }
    .hero-icon.error   { background: #fef2f2; color: #dc2626; }
    @keyframes pop { from {transform:scale(.5); opacity:0} to {transform:scale(1); opacity:1} }

    .pedido-hero h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .pedido-hero p {
      font-size: 15px;
      color: var(--gray);
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 16px;
    }
    .order-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--gray-lt);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    /* Pending PIX section */
    .pending-pix {
      background: var(--white);
      border: 2px solid #f7a809;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
      text-align: center;
    }
    .pending-pix h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .pending-pix p {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 14px;
    }
    .pix-status-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #b45309;
      font-weight: 600;
      margin: 12px 0 8px;
    }
    .pix-spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(180,83,9,.25);
      border-top-color: #b45309;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pending-qr {
      width: 220px;
      height: 220px;
      border-radius: 8px;
      margin: 12px auto;
      display: block;
      background: var(--white);
      padding: 6px;
      border: 1px solid var(--border);
    }
    .pix-code-mini {
      background: var(--gray-lt);
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      text-align: left;
    }
    .pix-code-mini-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .pix-code-mini-val {
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: #374151;
      word-break: break-all;
      max-height: 70px;
      overflow-y: auto;
      background: var(--white);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .btn-copy-mini {
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-copy-mini:hover { background: var(--navy-lt); }
    .btn-copy-mini.copied { background: var(--green); }

    /* Detail cards */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }
    @media (max-width: 720px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
    .detail-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
    }
    .detail-card h3 {
      font-size: 14px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-card h3 svg { color: var(--green); }

    .item-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; }
    .item-row img {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--gray-lt);
    }
    .item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.3;
    }
    .item-qty {
      font-size: 11px;
      color: var(--gray);
      margin-top: 2px;
    }
    .item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .totals-list {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .total-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #374151;
      padding: 4px 0;
    }
    .total-line.disc { color: var(--green); font-weight: 600; }
    .total-line.grand {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
    }
    .total-line.grand span:last-child { color: var(--green); }

    .info-line {
      font-size: 13px;
      color: #374151;
      line-height: 1.7;
    }
    .info-line strong {
      color: var(--navy);
      font-weight: 600;
    }
    .info-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    /* Next steps */
    .next-steps {
      background: var(--green-lt);
      border: 1px solid rgba(26,122,74,.18);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
    }
    .next-steps h3 {
      font-size: 14px;
      font-weight: 800;
      color: var(--green-dk);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .step {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      align-items: flex-start;
    }
    .step-num {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      background: var(--green);
      color: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }
    .step-text {
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
    }
    .step-text strong { color: var(--green-dk); }

    /* CTAs */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .actions { grid-template-columns: 1fr; }
    }
    .btn-act {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn-act.primary {
      background: var(--green);
      color: var(--white);
      border: none;
    }
    .btn-act.primary:hover { background: var(--green-dk); }
    .btn-act.outline {
      background: var(--white);
      color: var(--navy);
      border: 1px solid var(--border);
    }
    .btn-act.outline:hover { background: var(--gray-lt); }

    /* Empty/error state */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .empty-state h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      margin: 16px 0 8px;
    }
    .empty-state p {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 24px;
    }
  </style>
</head>

<script>
/* ════════════════════════════════════════════════════
   PEDIDO — Página de confirmação
   ════════════════════════════════════════════════════ */

const WORKER_URL = 'https://aloyoga-payments.celiasimoes28121960.workers.dev';

function fmt(v) {
  return 'R$ ' + (v / 100).toFixed(2).replace('.', ',');
}

function getTxId() {
  const params = new URLSearchParams(location.search);
  return params.get('id') || localStorage.getItem('arena_last_order') || '';
}

function loadOrder(txId) {
  if (!txId) return null;
  try {
    const raw = localStorage.getItem('arena_order_' + txId);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveOrder(order) {
  try { localStorage.setItem('arena_order_' + order.transactionId, JSON.stringify(order)); } catch (e) {}
}

function fmtPhone(n) {
  const d = (n || '').replace(/\D/g, '');
  if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
  return n || '';
}

function fmtCEP(n) {
  const d = (n || '').replace(/\D/g, '');
  if (d.length === 8) return d.replace(/(\d{5})(\d{3})/, '$1-$2');
  return n || '';
}

function fmtCPF(n) {
  const d = (n || '').replace(/\D/g, '');
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  return n || '';
}

/* ── Empty/missing states ──────────────────────────── */
function renderMissing() {
  document.getElementById('pedido-container').innerHTML = `
    <div class="empty-state">
      <div style="font-size:38px">📭</div>
      <h2>Pedido não encontrado</h2>
      <p>Não localizamos esse pedido no seu navegador. Acesse pelo link recebido por e-mail ou consulte em "Acompanhar pedido".</p>
      <div class="actions">
        <a href="index.html" class="btn-act primary">Voltar à loja</a>
        <a href="acompanhar.html" class="btn-act outline">Acompanhar pedido</a>
      </div>
    </div>
  `;
}

/* ── Main render ───────────────────────────────────── */
function render(order, liveStatus) {
  const status = (liveStatus || order.status || 'pending').toLowerCase();
  const isPaid = ['paid', 'authorized', 'approved'].includes(status);

  const heroHTML = isPaid
    ? `<div class="pedido-hero">
        <div class="hero-icon success">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1>Pedido confirmado!</h1>
        <p>Recebemos seu pagamento PIX e seu pedido já está sendo preparado para envio. Enviamos uma cópia desta confirmação para <strong>${order.customer?.email || 'seu e-mail'}</strong>.</p>
        <span class="order-badge">Pedido #${order.transactionId}</span>
      </div>`
    : `<div class="pedido-hero">
        <div class="hero-icon pending">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <h1>Aguardando pagamento</h1>
        <p>Seu pedido está reservado. Escaneie o QR Code abaixo ou copie o código PIX para concluir o pagamento.</p>
        <span class="order-badge">Pedido #${order.transactionId}</span>
      </div>`;

  let pendingPixHTML = '';
  if (!isPaid && order.pixCode) {
    pendingPixHTML = `
      <div class="pending-pix">
        <h2>Pague com PIX</h2>
        <p>Abra o app do seu banco e escaneie o QR Code</p>
        ${order.pixQrSrc ? `<img src="${order.pixQrSrc}" alt="QR Code PIX" class="pending-qr" />` : ''}
        <div class="pix-code-mini">
          <div class="pix-code-mini-label">Ou copie o código:</div>
          <div class="pix-code-mini-val" id="pix-code-val">${order.pixCode}</div>
          <button class="btn-copy-mini" id="btn-copy-mini" onclick="copyPixCode()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copiar código PIX
          </button>
        </div>
        <div class="pix-status-row">
          <span class="pix-spin"></span>
          Aguardando confirmação do pagamento...
        </div>
        <p style="font-size:11px;color:var(--gray);margin-top:6px">Esta página atualiza automaticamente quando o pagamento for confirmado.</p>
      </div>
    `;
  }

  const itemsHTML = (order.items || []).map(it => `
    <div class="item-row">
      <img src="${it.img || ''}" alt="${it.title}" onerror="this.style.display='none'" />
      <div>
        <div class="item-name">${it.title}</div>
        <div class="item-qty">Qtd: ${it.quantity} × ${fmt(it.unitPrice)}</div>
      </div>
      <div class="item-price">${fmt(it.unitPrice * it.quantity)}</div>
    </div>
  `).join('');

  const addr = order.shipping?.address || {};
  const cust = order.customer || {};

  document.getElementById('pedido-container').innerHTML = `
    ${heroHTML}
    ${pendingPixHTML}

    <div class="detail-grid">
      <div class="detail-card">
        <h3>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Itens do pedido
        </h3>
        ${itemsHTML || '<p class="info-line" style="color:var(--gray)">Sem itens registrados.</p>'}
        <div class="totals-list">
          <div class="total-line"><span>Subtotal</span><span>${fmt(order.subtotalCents || 0)}</span></div>
          <div class="total-line disc"><span>Desconto PIX (5%)</span><span>−${fmt(order.discountCents || 0)}</span></div>
          <div class="total-line"><span>Frete</span><span style="color:var(--green);font-weight:600">Grátis</span></div>
          <div class="total-line grand"><span>Total ${isPaid ? 'pago' : ''}</span><span>${fmt(order.amountCents || 0)}</span></div>
        </div>
      </div>

      <div class="detail-card">
        <h3>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Entrega
        </h3>
        <div class="info-line">
          <strong>${cust.name || '—'}</strong><br>
          ${addr.street || ''}${addr.streetNumber ? ', ' + addr.streetNumber : ''}${addr.complement ? ' — ' + addr.complement : ''}<br>
          ${addr.neighborhood || ''}${addr.neighborhood && addr.city ? ' • ' : ''}${addr.city || ''}${addr.state ? '/' + addr.state : ''}<br>
          CEP ${fmtCEP(addr.zipCode)}
        </div>
        <div class="info-divider"></div>
        <div class="info-line">
          <strong>Contato</strong><br>
          ${cust.email || ''}<br>
          ${fmtPhone(cust.phone)}<br>
          CPF: ${fmtCPF(cust.document?.number)}
        </div>
      </div>
    </div>

    ${isPaid ? `
      <div class="next-steps">
        <h3>Próximos passos</h3>
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text"><strong>Confirmação por e-mail</strong> — você receberá os detalhes do pedido em <strong>${cust.email || 'seu e-mail'}</strong> em alguns minutos.</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text"><strong>Preparo</strong> — separamos e embalamos os itens em até 1 dia útil.</div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text"><strong>Envio</strong> — você receberá o código de rastreio assim que o pedido for despachado.</div>
        </div>
      </div>
    ` : ''}

    <div class="actions">
      <a href="index.html" class="btn-act primary">Voltar à loja</a>
      <a href="catalogo.html" class="btn-act outline">Continuar comprando</a>
    </div>
  `;
}

/* ── Copy ──────────────────────────────────────────── */
function copyPixCode() {
  const txt = document.getElementById('pix-code-val')?.textContent || '';
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('btn-copy-mini');
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copiado!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar código PIX`;
    }, 1800);
  });
}

/* ── Polling for pending orders ────────────────────── */
let pollTimer = null;
async function pollStatus(order) {
  try {
    const r = await fetch(`${WORKER_URL}/status/${order.transactionId}`);
    const d = await r.json();
    const status = d?.data?.status;
    if (status && status !== order.status) {
      order.status = status;
      if (['paid', 'authorized', 'approved'].includes(status)) {
        order.paidAt = new Date().toISOString();
        saveOrder(order);
        clearInterval(pollTimer);
        render(order, status);
        return;
      }
      saveOrder(order);
    }
  } catch (e) { /* ignore */ }
}

/* ── Init ──────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async () => {
  const txId = getTxId();
  if (!txId) { renderMissing(); return; }

  let order = loadOrder(txId);

  // If we don't have the order locally, fetch what we can from the worker
  if (!order) {
    try {
      const r = await fetch(`${WORKER_URL}/status/${txId}`);
      const d = await r.json();
      if (d?.success && d?.data) {
        order = {
          transactionId: txId,
          status:        d.data.status || 'pending',
          paymentMethod: 'pix',
          items:         [],
          customer:      {},
          shipping:      { address: {} },
          amountCents:   0,
        };
      }
    } catch (e) {}
  }

  if (!order) { renderMissing(); return; }

  render(order);

  // Poll if still pending
  const isPaid = ['paid', 'authorized', 'approved'].includes((order.status || '').toLowerCase());
  if (!isPaid) {
    pollTimer = setInterval(() => pollStatus(order), 5000);
    // Stop after 30 min to avoid forever loop
    setTimeout(() => clearInterval(pollTimer), 30 * 60 * 1000);
  }
});
</script>
</body>
</html>
